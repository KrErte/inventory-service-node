# Host ports are overridable, because 3000 and 8080 are the two most contested
# ports on any developer machine:  WEB_PORT=4000 docker compose up
#
# The API is bound to 127.0.0.1 on purpose. Browsers never talk to it directly —
# nginx proxies /api inside the compose network — so publishing it on all
# interfaces would only widen the surface. Locally you can still curl it; on a
# public server it stays unreachable from outside.
services:
  api:
    build:
      context: ./backend
    environment:
      INVENTORY_DATA_PATH: /opt/inventory/data/inventory.json
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3100}:80"
