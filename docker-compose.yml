# Host ports are overridable, because 3000 and 8080 are the two most contested
# ports on any developer machine. Set them in a .env file next to this one, or
# inline:  WEB_PORT=4000 docker compose up
services:
  api:
    build:
      context: ./backend
    environment:
      INVENTORY_DATA_PATH: /opt/inventory/data/inventory.json
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3100}:80"
